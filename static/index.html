<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DediServer Orchestrator</title>
    <link rel="stylesheet" href="style.css?v=1.1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                <h1>Orquestador Ligero</h1>
            </div>
            <button class="btn primary" onclick="showDeployModal()">+ Nuevo Servidor</button>
        </header>

        <main>
            <div id="error-alert" class="alert error hidden"></div>
            <div id="success-alert" class="alert success hidden"></div>
            
            <div class="grid" id="servers-grid">
                <!-- Se llenará vía JS dinámicamente -->
            </div>
        </main>
    </div>

    <!-- Modal para Desplegar Contenedor -->
    <div id="deploy-modal" class="modal hidden">
        <div class="modal-content glass">
            <h2>Desplegar Servidor</h2>
            <div class="form-group" style="margin-top: 1.5rem">
                <label>Nombre de la Instancia</label>
                <input type="text" id="server-name" placeholder="Ej: survival-01" autocomplete="off" />
            </div>
            <div class="form-group">
                <label>Plantilla de Juego</label>
                <select id="server-template">
                    <!-- Se llena vía API con los JSON de templates/ -->
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn secondary" onclick="closeDeployModal()">Cancelar</button>
                <button class="btn primary" onclick="deployServer()">Desplegar</button>
            </div>
        </div>
    </div>

    <!-- Modal para Leer Logs -->
    <div id="logs-modal" class="modal hidden">
        <div class="modal-content glass" style="max-width: 800px; width: 90%;">
            <h2 id="logs-title" style="margin-bottom: 0.5rem;">Logs del Servidor</h2>
            <div class="terminal-container" id="logs-container">
                <!-- Se inyectan los logs aquí -->
            </div>
            <div class="modal-actions">
                <button class="btn secondary" onclick="closeLogsModal()">Cerrar</button>
                <button class="btn primary" onclick="refreshLogs()">Refrescar Ahora</button>
            </div>
        </div>
    </div>

    <script src="app.js?v=1.1"></script>
</body>
</html>
